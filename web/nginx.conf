upstream panel_api {
    server panel-api:8700;
    keepalive 8;
}

# Схема, которую видит браузер: за обратным прокси NAS (режим PANEL_TLS=off) — из его заголовка.
# От неё зависит флаг Secure у cookie сессии (см. panel-api auth).
map $http_x_forwarded_proto $vp_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # Порт 443 внутри контейнера. По умолчанию — HTTPS с самоподписанным сертификатом,
    # PANEL_TLS=off — обычный HTTP за обратным прокси (выбирает 40-tunnelwright-tls.sh при старте).
    include /etc/nginx/tunnelwright/listen.conf;
    server_name _;

    add_header X-Frame-Options        DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy        no-referrer always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # ── React SPA ──────────────────────────────────────────
    # На отдельном адресе страниц пользователей (настройка «Адрес ссылок») интерфейс не отдаётся:
    # panel-api отвечает 403 для этого хоста, nginx показывает 404 — там открываются только /u/
    location / {
        auth_request /_panel_host;
        error_page 403 =404 /_not_found;
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options        DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy        no-referrer always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Манифест для установки на главный экран: в mime.types nginx нет .webmanifest
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /_panel_host {
        internal;
        proxy_pass              http://panel_api/api/host-check;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Host $host;
    }

    location = /_not_found {
        internal;
        default_type text/plain;
        return 404 "not found\n";
    }

    # ── panel-api: авторизация проверяется в самом panel-api ──
    location /api/ {
        proxy_pass         http://panel_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $vp_proto;
        proxy_read_timeout 60s;
    }

    # ── страница пользователя по личной ссылке (без входа; токен проверяет panel-api) ──
    location /u/ {
        proxy_pass         http://panel_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $vp_proto;
        proxy_read_timeout 30s;
        access_log         off;              # токен в URL — не пишем в лог
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
